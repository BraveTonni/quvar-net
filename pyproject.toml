[project]
name = "quvar-net"
version = "0.1.0"
description = "Network node discovery and monitoring lab"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.124.0",
    "gputil>=1.4.0",
    "loguru>=0.7.3",
    "orjson>=3.11.4",
    "psutil>=7.1.3",
    "py-cpuinfo>=9.0.0",
    "pydantic>=2.12.5",
    "setuptools>=80.9.0",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = ["pytest>=9.0.1", "pytest-asyncio>=1.3.0"]
